# ---------------------------------------------------------------------------
# my-gutachter-internal — full stack (mongo + backend + frontend/nginx).
#
# Usage:
#   cp .env.example .env      # then fill in secrets
#   docker compose up --build
#   open http://localhost:8088
#
# Same-origin: nginx (frontend) serves the SPA and proxies /api + /signal to the
# backend, so only the frontend port is published. Switch dev/prod with the
# SPRING_PROFILES_ACTIVE var in .env (dev = OMT dev server, prod = OMT prod).
# ---------------------------------------------------------------------------
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Reachable by the backend over the compose network as `mongo:27017`.
    # Uncomment to inspect from the host:
    # ports:
    #   - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    # All secrets + config come from the root .env (see .env.example). The two
    # values below are overridden here so the app targets the compose services
    # regardless of what .env says.
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    expose:
      - "8080"
    # Uncomment to hit the API directly from the host (bypassing nginx):
    # ports:
    #   - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the SPA at build time. `/api` = same-origin (proxied below).
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # nginx reverse-proxies /api and /signal here (envsubst in nginx.conf).
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  mongo-data:
