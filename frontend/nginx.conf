# nginx template. The official nginx image runs `envsubst` on this file at
# startup, substituting ONLY environment variables (e.g. ${BACKEND_URL}); nginx's
# own runtime vars ($uri, $host, $http_upgrade, …) are left untouched.
#
# Same-origin model: the SPA is served here and /api + /signal are proxied to the
# backend, so the browser talks to one origin (no CORS, WebSocket works). For a
# separate API host instead, drop the two proxy blocks and build the image with
# --build-arg VITE_API_URL=https://api.<env>.example.com/api.

# WebSocket upgrade mapping (http context — conf.d is included inside http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API → backend. client_max_body_size matches the backend's 500MB
    # multipart limit (video recordings).
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }

    # WebRTC signaling (plain WebSocket at /signal) → backend, with upgrade headers.
    location /signal {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — everything else serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
