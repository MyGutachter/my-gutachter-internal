# Legal Disclaimer Page
disclaimer.title=Basis and Scope of Inspection
disclaimer.p1=The UVV vehicle inspection was conducted in accordance with DGUV Regulation 70 and DGUV Principle 314-003. The subject of the inspection is the assessment of the vehicle's operational safety. Operational safety encompasses both road safety and occupational safety.
disclaimer.p2=The inspection aims to determine whether the vehicle can be used safely in an operational context and whether there are any discernible defects that could impair safe use. This inspection does not replace the statutory periodic technical inspection (Hauptuntersuchung) under the StVZO or any mandatory safety inspection, as those primarily address road safety. Furthermore, the UVV inspection takes into account aspects relevant to occupational safety\u2014specifically regarding operational use, vehicle equipment, load securing, auxiliary systems, and safety-critical work equipment attached to the vehicle.
disclaimer.p3=The UVV inspection must be carried out at least once a year by a competent or qualified person. The inspection results are documented in this report. Any defects identified must be assessed according to their severity and rectified within a reasonable timeframe. In the event of defects affecting safety or posing a risk to road safety, the vehicle must not be operated\u2014or may only be operated under restricted conditions\u2014until the defects have been rectified.

# 54 Checklist Items
checklist.item.1=Vehicle data complete: License plate, VIN, Owner, Mileage, Date
checklist.item.2=Registration certificate / vehicle papers present or plausible
checklist.item.3=HU (Main inspection) valid / sticker checked
checklist.item.4=Front/rear license plates present, legible, secure
checklist.item.5=General vehicle condition without recognizable safety-relevant damage
checklist.item.6=Bodywork without sharp edges, loose parts or accident damage
checklist.item.7=Doors, hoods, flaps, hinges and locks work safely
checklist.item.8=Windows without safety-relevant cracks/stone chips in the field of vision
checklist.item.9=Mirrors present, secure, undamaged and adjustable
checklist.item.10=Windshield wipers work
checklist.item.11=Windshield washer system works, washer fluid present
checklist.item.12=Front lighting: low beam, high beam, side lights
checklist.item.13=Rear lighting: tail light, brake light, reversing light
checklist.item.14=Turn signals and hazard warning lights work
checklist.item.15=Rear fog light / fog lights, if present
checklist.item.16=Reflectors and retro-reflectors present and undamaged
checklist.item.17=Horn works
checklist.item.18=Brake system functionally inconspicuous, pedal travel/pressure point plausible
checklist.item.19=Parking brake works
checklist.item.20=Steering without noticeable play/noise
checklist.item.21=Suspension/springs externally without safety-relevant abnormalities
checklist.item.22=Tires: sufficient tread depth
checklist.item.23=Tires: no damage, bulges, cracks, foreign bodies
checklist.item.24=Tires: correct dimension / matching per axle / load index plausible
checklist.item.25=Tire pressure checked or plausible
checklist.item.26=Rims/wheels without visible damage, wheel nuts/bolts inconspicuous
checklist.item.27=Seat belts present, functional, no damage
checklist.item.28=Seats, seat adjustment, headrests secure and functional
checklist.item.29=Airbag/ABS/ESP/brake warning lights without fault display
checklist.item.30=Warning triangle present
checklist.item.31=High-visibility vest present
checklist.item.32=First aid kit present and not expired
checklist.item.33=Fire extinguisher present, if prescribed or operationally required
checklist.item.34=Load securing equipment present and usable, if vehicle is used for this purpose
checklist.item.35=Lashing points, partitions, shelf installations, lashing rails secure and undamaged
checklist.item.36=Load compartment without loose, dangerous or unsecured objects
checklist.item.37=Trailer coupling, socket, safety device checked, if present
checklist.item.38=Trailer operation: permissible trailer/tongue load known and marking plausible
checklist.item.39=Electrical system/battery externally safe, no loose cables or terminals
checklist.item.40=Fluid leaks: engine oil, coolant, brake fluid, fuel, AdBlue
checklist.item.41=Engine compartment without loose parts, leaks or fire hazard
checklist.item.42=Exhaust system secure, tight, without dangerous damage
checklist.item.43=Fuel filler cap/charging port securely lockable
checklist.item.44=For electric/hybrid vehicles: charging cable present, undamaged, correctly stored
checklist.item.45=For electric/hybrid vehicles: charging port/flap undamaged
checklist.item.46=Driver assistance/camera systems externally clear and functional, if relevant
checklist.item.47=Reversing camera/parking sensors, if relevant for safe operation
checklist.item.48=Operational auxiliary equipment securely attached, e.g. tools, auxiliary components, shelves
checklist.item.49=Special bodies, tail lifts, tailboard, cooling etc. checked, if present
checklist.item.50=Test drive/functional check without safety-relevant abnormalities
checklist.item.51=Defects documented and assessed: minor / significant / traffic-hazardous
checklist.item.52=Inspection decision: vehicle operationally safe
checklist.item.53=Re-inspection required
checklist.item.54=Inspector, qualification, date, signature documented
