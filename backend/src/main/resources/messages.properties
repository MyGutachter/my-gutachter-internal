# Legal Disclaimer Page
disclaimer.title=Pr\u00FCfgrundlage und Pr\u00FCfumfang
disclaimer.p1=Die UVV-Fahrzeugpr\u00FCfung wurde auf Grundlage der DGUV Vorschrift 70 sowie des DGUV Grundsatzes 314-003 durchgef\u00FChrt. Gegenstand der Pr\u00FCfung ist die Beurteilung des betriebssicheren Zustands des Fahrzeugs. Der betriebssichere Zustand umfasst sowohl die Verkehrssicherheit als auch die Arbeitssicherheit des Fahrzeugs.
disclaimer.p2=Die Pr\u00FCfung dient der Feststellung, ob das Fahrzeug im betrieblichen Einsatz sicher verwendet werden kann und ob erkennbare M\u00E4ngel vorliegen, die die sichere Nutzung beeintr\u00E4chtigen k\u00F6nnen. Die Pr\u00FCfung ersetzt keine Hauptuntersuchung nach StVZO und keine gegebenenfalls erforderliche Sicherheitspr\u00FCfung, da diese \u00FCberwiegend die Verkehrssicherheit betreffen. Die UVV-Pr\u00FCfung ber\u00FCcksichtigt dar\u00FCber hinaus arbeitssicherheitsrelevante Aspekte, insbesondere im Zusammenhang mit betrieblicher Nutzung, Fahrzeugausstattung, Ladungssicherung, Zusatzeinrichtungen und sicherheitsrelevanten Arbeitsmitteln am Fahrzeug.
disclaimer.p3=Die UVV-Pr\u00FCfung ist mindestens einmal j\u00E4hrlich durch eine sachkundige beziehungsweise bef\u00E4higte Person durchzuf\u00FChren. Das Ergebnis der Pr\u00FCfung wird im vorliegenden Pr\u00FCfbericht dokumentiert. Festgestellte M\u00E4ngel sind entsprechend ihrer Relevanz zu bewerten und innerhalb einer angemessenen Frist zu beseitigen. Bei sicherheitsrelevanten oder verkehrsgef\u00E4hrdenden M\u00E4ngeln darf das Fahrzeug bis zur M\u00E4ngelbeseitigung nicht oder nur eingeschr\u00E4nkt weiterbetrieben werden.

