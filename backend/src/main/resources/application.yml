# ---------------------------------------------------------------------------
# Common configuration (shared across all profiles).
# Environment-specific values (OMT URLs, Mongo, DB name) live in
# application-dev.yml / application-prod.yml.
# Secrets are injected via environment variables — never commit real values.
#
# NOTE: S3, Caffeine cache, unified `orders` collection and JWT config are added
# in later tasks (T1.1/T1.2 storage, T2.x auth, T3.1 orders). Kept out here so the
# current classpath boots cleanly.
# ---------------------------------------------------------------------------
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  messages:
    fallback-to-system-locale: false
  servlet:
    multipart:
      # 500MB accommodates full video-call recordings (T4.1); report photos are far smaller.
      max-file-size: 500MB
      max-request-size: 500MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=50m

server:
  port: ${SERVER_PORT:8080}

# DAT SOAP API (VIN lookup) — same across environments; secrets via env vars
dat:
  customer-number: ${DAT_CUSTOMER_NUMBER}
  customer-login: ${DAT_CUSTOMER_LOGIN}
  customer-password: ${DAT_CUSTOMER_PASSWORD}
  interface-partner-number: ${DAT_INTERFACE_PARTNER_NUMBER}
  interface-partner-signature: ${DAT_INTERFACE_PARTNER_SIGNATURE}
  auth-url: https://www.datgroup.com/DATECodeSelection/services/Authentication
  vin-url: https://www.datgroup.com/DATECodeSelection/services/VehicleIdentificationService

# AWS S3 — unified file storage (same bucket across environments unless overridden)
aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION:eu-central-1}
  s3:
    bucket: ${AWS_S3_BUCKET:video-xpert}

# JWT — HS256; secret is a Base64-encoded key (>= 256 bits). 24h expiry (Decision Q4).
# The dev default lets the app boot locally; override JWT_SECRET in real environments.
jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kLTAxMjM0NTY3ODlhYmNkZWZnaGlqa2xtbm9w}
  expiration: ${JWT_EXPIRATION:86400000}

# Twilio — SMS meeting invites only (T4.1). Secrets via env vars; blank in dev = SMS skipped.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}

# Mailgun — secrets via env vars
mailgun:
  api-key: ${MAILGUN_API_KEY}
  domain: ${MAILGUN_DOMAIN:mygutachter.com}
  region: ${MAILGUN_REGION:api.eu.mailgun.net}
  from-email: ${MAILGUN_FROM_EMAIL:Auftrag@mygutachter.com}

# OMT outbound — shared API key sent in the body of UVV calls (T4.2, Decision Q9).
# Per-environment OMT server URLs (dev-backend-url / prod-backend-url) live in the
# profile files; the app routes UVV by the order's `source`. Blank = OMT calls no-op safely.
omt:
  api-key: ${OMT_API_KEY:}


# MongoDB collection names. The `orders` collection is the single unified order store
# (Decision Q6, T3.1) — it replaces the former `reports` collection; report data lives as
# flat fields on the same order document.
mongodb:
  collections:
    users: users
    orders: orders
    rateConfig: rateConfig
    fieldConfigs: fieldConfigs

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # Frontend base URL used to build the password-reset link (T2.4).
  frontend-url: ${APP_FRONTEND_URL:https://internal-app.omt-mygutachter.com}
  # Backend base URL used to build absolute screenshot URLs (T4.1).
  backend-url: ${APP_BACKEND_URL:https://internal-api.omt-mygutachter.com}
  quick-register:
    api-key: ${QUICK_REGISTER_API_KEY:sk_rCg1k6cltHZWQxnem4k1X2tWeKe5EtL4Zcx2OnwH}
