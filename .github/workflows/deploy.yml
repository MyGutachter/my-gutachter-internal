name: 🚀 Deploy My-Gutachter-Internal

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ github.ref_name == 'main' && secrets.MAIN_SERVER_HOST || secrets.PROD_SERVER_HOST }}
  DEPLOY_USER: ${{ github.ref_name == 'main' && secrets.MAIN_SERVER_USERNAME || secrets.PROD_SERVER_USERNAME }}
  DEPLOY_KEY:  ${{ github.ref_name == 'main' && secrets.MAIN_SSH_PRIVATE_KEY || secrets.PROD_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: 🚀 Deploy My-Gutachter-Internal
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Determine Changes
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "Manual trigger (workflow_dispatch) detected. Deploying both backend and frontend."
            exit 0
          fi

          git fetch origin
          
          BEFORE_SHA="${{ github.event.before }}"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="HEAD~1"
          fi
          
          echo "Comparing $BEFORE_SHA with ${{ github.sha }}"
          
          BACKEND_CHANGED=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} | grep '^backend/' || true)
          FRONTEND_CHANGED=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} | grep '^frontend/' || true)
          
          if [ -n "$BACKEND_CHANGED" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "Backend changes detected."
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "$FRONTEND_CHANGED" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "Frontend changes detected."
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -z "$BACKEND_CHANGED" ] && [ -z "$FRONTEND_CHANGED" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "No directory-specific changes detected, deploying both backend and frontend."
          fi

      - name: 🔍 Determine Server
        id: server
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "git_dir=/opt/my-gutachter-internal/my-gutachter-internal" >> $GITHUB_OUTPUT
            echo "compose_dir=/opt/my-gutachter-internal" >> $GITHUB_OUTPUT
            echo "compose_cmd=sudo docker-compose" >> $GITHUB_OUTPUT
            echo "docker_cmd=sudo docker" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "git_dir=/home/ubuntu/repositories/my-gutachter-internal" >> $GITHUB_OUTPUT
            echo "compose_dir=/home/ubuntu/repositories" >> $GITHUB_OUTPUT
            echo "compose_cmd=docker compose" >> $GITHUB_OUTPUT
            echo "docker_cmd=docker" >> $GITHUB_OUTPUT
            echo "branch=develop" >> $GITHUB_OUTPUT
          fi

      - name: 🔌 Pull Code & Deploy on Server
        uses: appleboy/ssh-action@master
        env:
          BACKEND_CHANGED: ${{ steps.set.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.set.outputs.frontend }}
          GIT_DIR: ${{ steps.server.outputs.git_dir }}
          COMPOSE_DIR: ${{ steps.server.outputs.compose_dir }}
          COMPOSE_CMD: ${{ steps.server.outputs.compose_cmd }}
          DOCKER_CMD: ${{ steps.server.outputs.docker_cmd }}
          BRANCH: ${{ steps.server.outputs.branch }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: BACKEND_CHANGED,FRONTEND_CHANGED,GIT_DIR,COMPOSE_DIR,COMPOSE_CMD,DOCKER_CMD,BRANCH
          script: |
            echo "=================================================="
            echo "📁 Navigating to repository..."
            cd "$GIT_DIR"
            
            echo "📥 Fetching and pulling latest changes from origin/$BRANCH..."
            git fetch origin
            git reset --hard origin/$BRANCH
            echo "=================================================="
            
            echo "🐳 Navigating to Docker Compose directory..."
            cd "$COMPOSE_DIR"
            
            if [ "$BACKEND_CHANGED" = "true" ] && [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "🔨 Rebuilding & restarting both backend & frontend containers..."
              $COMPOSE_CMD build --no-cache internal_backend internal_frontend && $COMPOSE_CMD up -d --no-deps internal_backend internal_frontend
            elif [ "$BACKEND_CHANGED" = "true" ]; then
              echo "🔨 Rebuilding & restarting backend container (internal_backend)..."
              $COMPOSE_CMD build --no-cache internal_backend && $COMPOSE_CMD up -d --no-deps internal_backend
            elif [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "🔨 Rebuilding & restarting frontend container (internal_frontend)..."
              $COMPOSE_CMD build --no-cache internal_frontend && $COMPOSE_CMD up -d --no-deps internal_frontend
            else
              echo "ℹ️ No changes detected to build or deploy."
            fi
            
            echo "🧹 Pruning unused Docker images..."
            $DOCKER_CMD image prune -f
            echo "=================================================="
